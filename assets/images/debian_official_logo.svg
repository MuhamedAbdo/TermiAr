<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="debianGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D70A53;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9184A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A80030;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Official Debian Swirl Logo -->
  <g transform="translate(32, 32)">
    <!-- Main spiral swirl -->
    <path d="M 0,-20 
             C -8,-20 -14,-14 -14,-6
             C -14,2 -8,8 0,8
             C 6,8 10,4 10,-2
             C 10,-6 8,-10 4,-12
             C 2,-13 0,-13 0,-11
             C 0,-9 1,-8 2,-7
             C 3,-6 3,-4 2,-2
             C 1,2 -2,4 -6,4
             C -12,4 -16,0 -16,-6
             C -16,-14 -10,-20 0,-20
             C 12,-20 20,-12 20,0
             C 20,10 12,18 0,18
             C -14,18 -24,8 -24,-6
             C -24,-20 -14,-30 0,-30
             C 16,-30 28,-18 28,0
             C 28,16 16,28 0,28
             C -18,28 -32,14 -32,-6
             C -32,-26 -18,-40 0,-40"
          fill="url(#debianGradient)" 
          stroke="url(#debianGradient)" 
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
    
    <!-- Inner spiral detail for depth -->
    <path d="M 0,-12
             C -4,-12 -7,-9 -7,-5
             C -7,-1 -4,2 0,2
             C 3,2 5,0 5,-3
             C 5,-5 4,-7 2,-8
             C 1,-8.5 0,-8.5 0,-7.5"
          fill="none" 
          stroke="#A80030" 
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.7"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#8B0026" opacity="0.8"/>
  </g>
</svg>
