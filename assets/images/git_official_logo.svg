<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05032" />
      <stop offset="100%" stop-color="#E24329" />
    </linearGradient>
  </defs>
  <!-- Git Rotated Rounded Square / Diamond -->
  <g transform="translate(32,32) rotate(45) translate(-32,-32)">
