    <!-- Branch network lines -->
    <path d="M 23,23 L 23,41" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 23,32 L 39,23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="23" cy="23" r="5" fill="#FFFFFF" />
    <circle cx="23" cy="41" r="5" fill="#FFFFFF" />
    <circle cx="39" cy="23" r="5" fill="#FFFFFF" />
